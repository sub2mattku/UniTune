name: PlatformIO Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Run PlatformIO Build
        run: pio run
        working-directory: ./Esp32Code   # <--- Tells PlatformIO to run inside your folder

      - name: Upload Firmware Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: Esp32Code/.pio/build/esp32dev/firmware.bin  # <--- Points to the binary inside the subfolder
