name: PlatformIO Build Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('Esp32Code/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install --upgrade platformio esptool

      - name: Run PlatformIO Build
        run: pio run -e esp32dev
        working-directory: ./Esp32Code

      - name: Merge binaries into a single flashable image
        working-directory: ./Esp32Code
        run: |
          BUILD=.pio/build/esp32dev
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin | head -n 1)
          echo "boot_app0: $BOOT_APP0"

          python -m esptool --chip esp32 merge_bin \
            -o $BUILD/firmware-merged.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000  $BUILD/bootloader.bin \
            0x8000  $BUILD/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 $BUILD/firmware.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            Esp32Code/.pio/build/esp32dev/firmware-merged.bin
            Esp32Code/.pio/build/esp32dev/firmware.bin
          if-no-files-found: error
